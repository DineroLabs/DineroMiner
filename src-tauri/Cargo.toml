[package]
name = "dinerominer"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bech32 = "0.11"
sha2 = "0.10"
hex = "0.4"
regex = "1"
hostname = "0.4"

[lib]
name = "dinerominer"
crate-type = ["staticlib", "cdylib", "rlib"]
